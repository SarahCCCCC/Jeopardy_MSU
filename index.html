<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:14px 10px 28px}
h1{font:700 clamp(1.3rem,4vw,2rem)/1.2 Georgia,"Noto Serif TC",serif;margin:0}
.b{background:var(--tile);color:#fff;border:2px solid transparent;padding:.55rem 1rem;border-radius:6px;font:inherit;cursor:pointer}
.b.g{background:var(--gold);color:#10202a;font-weight:700}
.b.ok{background:transparent;border-color:var(--ok);color:var(--ok)}
.b.no{background:transparent;border-color:var(--no);color:var(--no)}
.b.pick{background:currentColor}.b.pick{color:#fff}
.b:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
#teams{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.team{background:var(--panel);border-left:4px solid var(--gold);padding:6px 14px;border-radius:6px;min-width:110px}
.team span{display:block;color:var(--mute);font-size:.85rem}
.team b{font:700 1.6rem/1.1 Georgia,serif;color:var(--gold)}
#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cat{background:var(--panel);border-bottom:3px solid var(--gold);padding:10px 4px;text-align:center;font-weight:700;font-size:clamp(.68rem,1.9vw,1.1rem);display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere}
.tile{background:var(--tile);color:#f4c35a;border:0;border-radius:6px;min-height:clamp(54px,12vh,96px);font:700 clamp(1.1rem,4vw,2.3rem) Georgia,serif;cursor:pointer}
.tile:hover{filter:brightness(1.15)}
.tile.used{background:var(--dim);cursor:default;filter:none}
#setup{max-width:420px;margin:8vh auto;padding:0 6px}
#setup input{width:100%;padding:.6rem;margin:6px 0;border-radius:6px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
#setup p{color:var(--mute)}
#m{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:5;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px))}
#m>div.in{max-width:760px;margin:0 auto}
.mh{font:700 1.1rem Georgia,serif;color:var(--gold);margin-bottom:8px}
.bar{height:8px;background:var(--dim);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--gold)}
#clk{font:700 1.6rem Georgia,serif;text-align:right;color:var(--gold)}
.qt{font-size:clamp(1.15rem,3.6vw,1.6rem);line-height:1.45;margin:6px 0 14px}
.xr{max-width:100%;border-radius:6px;margin-bottom:12px}
.opts{list-style:none;padding:0;margin:0 0 16px}
.opts li{display:flex;gap:12px;align-items:baseline;border:2px solid var(--line);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:clamp(1rem,3vw,1.25rem)}
.opts li span{font:700 1rem Georgia,serif;color:var(--gold)}
.opts li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opts li.no{opacity:.45}
.sr{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.sr span{flex:1 1 120px;font-weight:700}
#ans{margin-bottom:16px}
select{padding:.4rem;border-radius:6px;background:var(--panel);color:var(--ink);border:2px solid var(--line);font:inherit}
.ex{background:var(--panel);border-left:4px solid var(--gold);padding:10px 14px;border-radius:6px;margin:0 0 12px;font-size:1.05rem}
.b{min-height:44px}.opts li.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,transparent)}
@media(max-width:600px){main{padding:10px 6px 24px}#board{gap:4px}.tile{min-height:60px;font-size:1.05rem}.cat{font-size:.62rem;padding:8px 2px}.team{min-width:0;flex:1 1 40%;padding:4px 10px}.sr .b{flex:1 1 45%}.opts li{padding:12px}#cl,#rv,#go,#fin,#again{width:100%;margin-top:8px}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none!important}}
</style></head><body><main>

<p><button class="b g" id="st">Start game</button></p>
</div>
<div id="game" hidden>

<div id="teams"></div>

"Diazepam relaxes the striated muscle of the external urethral sphincter. Prazosin and phenoxybenzamine are alpha-blockers that relax the smooth muscle of the internal sphincter.",

"Bethanechol is a muscarinic (cholinergic) agonist that stimulates detrusor contraction. It is used for detrusor atony.",
"Phenylpropanolamine is an alpha agonist that raises urethral sphincter tone, so it treats incontinence from a weak sphincter mechanism.",

"A young small-breed dog with seizures after eating suggests a portosystemic shunt causing hepatic encephalopathy. Yorkies are predisposed.",

"The gag reflex is tested through CN IX and X (glossopharyngeal and vagus).",
"CN VII (facial) supplies the muscles of facial expression.",

"The patellar reflex is mediated by the femoral nerve (L4-L6).",
"The radial nerve supplies the triceps and the extensors of the limb. Radial paralysis means the animal cannot extend the elbow to bear weight.",
"The sciatic nerve arises from L6, L7 and S1 in the dog.",

"Acquired myasthenia gravis is immune mediated: autoantibodies attack acetylcholine receptors at the neuromuscular junction.",

UAFFFFABRRRQB//2Q==">':''}<ol class="opts">${q[1].map((o,i)=>`<li><span>${'ABCD'[i]}</span>${o}</li>`).join('')}</ol>`}
const amt=(i,f)=>f?W[i]:cur.v;
function reveal(q,f,x){clearInterval(tm);if(!f)used[cur.k]=1;
document.querySelectorAll('.opts li').forEach((li,i)=>li.classList.add(i==q[2]?'ok':'no'));
$('#ans').innerHTML=`<div class="ex"><b>Why:</b> ${x}</div>`+T.map((t,i)=>`<div class="sr"><span>${esc(t.n)}</span><button class="b ok" data-i="${i}" data-d="1">Correct +${amt(i,f)}</button><button class="b no" data-i="${i}" data-d="-1">Wrong −${amt(i,f)}</button></div>`).join('');
$('#ans').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i;T[i].s+=b.dataset.d*amt(i,f);b.parentNode.querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add('pick');scores()}}
function wire(q,f,x){document.querySelectorAll('.opts li').forEach((li,i)=>{li.tabIndex=0;li.setAttribute('role','button');li.style.cursor='pointer';li.onclick=()=>ans(q,f,x,i);li.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();ans(q,f,x,i)}}})}
function ans(q,f,x,i){clearInterval(tm);const t=i<0?0:(i==q[2]?1:-1),a=f?W[0]:cur.v;tot++;if(t>0)ok++;T[0].s+=t*a;scores();
document.querySelectorAll('.opts li').forEach((li,j)=>{li.onclick=li.onkeydown=null;li.removeAttribute('tabindex');li.style.cursor='';li.classList.add(j==q[2]?'ok':(j==i?'bad':'no'))});
$('#ans').innerHTML=`<div class="ex"><b>${t>0?'Correct +'+a:t<0?'Wrong −'+a:"Time's up"}.</b> ${x}</div>`;const c=$('#cl');if(c)c.hidden=false;const n=$('#fin');if(n)n.hidden=false}
function openQ(k){const[r,c,w]=k.split('-').map(Number),q=R[r].c[c].q[w],v=R[r].v[w];cur={k,v};
show(`<div class="mh">${R[r].c[c].n} · ${v}</div>`+body(q)+'<div id="ans"><button class="b g" id="rv">Show answer</button></div><button class="b" id="cl">Back to board</button>');
const x=E[r*25+c*5+w];if(solo){used[k]=1;$('#rv').remove();$('#cl').hidden=true;wire(q,0,x);clock(q[3],()=>ans(q,0,x,-1))}else{clock(q[3]);$('#rv').onclick=()=>reveal(q,0,x)}$('#cl').onclick=()=>{hide();draw()}}
function wager(){show(`<div class="mh">Final Jeopardy</div><p class="qt">${F.cat}</p><p>Each team: choose what percent of your current score to wager.</p>`+T.map((t,i)=>`<div class="sr"><span>${esc(t.n)}(${t.s} pts)</span><select aria-label="${esc(t.n)} wager percent">${[0,25,50,75,100].map(p=>`<option>${p}</option>`).join('')}</select>%</div>`).join('')+'<button class="b g" id="go">Show question</button> <button class="b" id="cl">Back to board</button>');
$('#cl').onclick=hide;
$('#go').onclick=()=>{W=[...document.querySelectorAll('#m select')].map((s,i)=>Math.max(0,Math.round(T[i].s*s.value/100)));
show('<div class="mh">Final Jeopardy</div>'+body(F.q)+'<div id="ans"><button class="b g" id="rv">Show answer</button></div><button class="b" id="fin">See results</button>');
if(solo){$('#rv').remove();$('#fin').hidden=true;wire(F.q,1,E[50]);clock(F.q[3],()=>ans(F.q,1,E[50],-1))}else{clock(F.q[3]);$('#rv').onclick=()=>reveal(F.q,1,E[50])}$('#fin').onclick=result}}
function result(){hide();const s=[...T].sort((a,b)=>b.s-a.s);show('<div class="mh">Final results</div>'+(solo?`<p>${ok} of ${tot} correct</p>`:'')+s.map((t,i)=>`<div class="sr"><span>${i+1}. ${esc(t.n)}</span><b class="mh">${t.s} pts</b></div>`).join('')+'<p><button class="b g" id="again">Play again</button> <button class="b" id="cl">Close</button></p>');
$('#again').onclick=()=>location.reload();$('#cl').onclick=hide}
$('#st').onclick=()=>{solo=+$('#md').value;T=[...document.querySelectorAll('.tn')].map(i=>i.value.trim()).filter(Boolean).map(n=>({n,s:0}));if(solo)T=[{n:T[0]?T[0].n:'Player',s:0}];if(!T.length)return;$('#setup').hidden=true;$('#game').hidden=false;draw()};
$('#board').onclick=e=>{const b=e.target.closest('.tile[data-k]');if(b)openQ(b.dataset.k)};
$('#hm').onclick=()=>{if(confirm('Return to the start page? Scores will be reset.'))location.reload()};$('#bk').onclick=()=>{ri=0;draw()};$('#nx').onclick=()=>{if(ri==0){ri=1;draw()}else wager()};
</script></body></html>
